apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: node:20
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - |
              npm install -g bun
              bun install
              bun run server
          ports:
            - containerPort: 4000
          env:
            - name: EXPO_PUBLIC_SUPABASE_URL
              value: "http://postgres:5432" # Internal cluster DNS
            - name: EXPO_PUBLIC_SUPABASE_ANON_KEY
              value: "placeholder-anon-key" # In real k8s, use Secrets
            - name: SUPABASE_SERVICE_ROLE_KEY
              value: "placeholder-service-key"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/postgres"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai-api-key
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          hostPath:
            path: /Users/andrew/Desktop/FL2025-Semester-Project # Map local project for development
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: server
  ports:
    - port: 4000
      targetPort: 4000
